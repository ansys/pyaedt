name: GitHub CI CD
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Disable all default permissions at workflow level for security (least privilege principle)
# Individual jobs will explicitly request only the permissions they need
permissions: {}

jobs:

  test-python-windows:
    name: "Test python windows"
    runs-on: [ self-hosted, Windows, pyaedt ]
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14, 3.15]
      fail-fast: false
    steps:
      - name: Setup Python
        uses: ansys/actions/_setup-python@refactor/revert-changes-and-leverage-latest-python
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Log result
        uses: ansys/actions/_logging@refactor/revert-changes-and-leverage-latest-python
        with:
          level: "INFO"
          message: >
            Windows - Python version installed: ${{ steps.setup-python.outputs.python-version }}

  test-python-linux:
    name: "Test python Linux"
    runs-on: [ self-hosted, Linux, pyaedt ]
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14, 3.15]
      fail-fast: false
    steps:

      - name: Setup Python
        uses: ansys/actions/_setup-python@refactor/revert-changes-and-leverage-latest-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python version
        id: check-python-version
        run: echo "python-version=$(python --version)" >> $GITHUB_OUTPUT

      - name: Log result
        uses: ansys/actions/_logging@refactor/revert-changes-and-leverage-latest-python
        with:
          level: "Warning"
          message: >
            Linux - Python version installed: ${{ steps.check-python-version.outputs.python-version }}
